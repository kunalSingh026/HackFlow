name: HackFlow CI Pipeline

on:
  push:
    branches:
      - main
      - feature/secure-auth
      - feature/devops-integration
  pull_request:
    branches:
      - main
      - feature/secure-auth
      - feature/devops-integration

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Run ESLint
        run: npm run lint
        working-directory: Backend

      - name: Run Prettier Format Check
        run: npm run format:check
        working-directory: Backend

      - name: Run Integration Tests
        run: npm test
        working-directory: Backend
        env:
          MONGO_URI: mongodb://localhost:27017/hackflow-test
          JWT_SECRET: ci_test_jwt_secret_must_be_long_and_secure_32_bytes_at_least
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_must_be_long_and_secure_32_bytes_at_least
          PORT: 3000
          NODE_ENV: test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Run Prettier Format Check
        run: npm run format:check
        working-directory: frontend
