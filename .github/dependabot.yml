version: 2
updates:
  # Maintain dependencies for the backend
  - package-ecosystem: 'npm'
    directory: '/Backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  # Maintain dependencies for the frontend
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
